[project]
name = "ya-pickledb"
version = "0.2.0"
description = "Yet another PickleDB (thread-safe!)"
authors = [{ name = "Angelo Delicato", email = "thelicato@duck.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.2.1",
    "safer>=6.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ya_pickledb"]
